[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mnemostack"
version = "1.0.3"
description = "mnemostack memory provider for hermes-agent: persistent agent memory over a mnemostack service or a local Qdrant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hermes-mnemostack contributors" }]
keywords = ["hermes-agent", "mnemostack", "memory", "agent", "rag", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# mnemostack 2.2 ships the remote write/lifecycle surface and the library
# helpers used here (ingest_remote_items, expand_remote_items, coerce_point_ids).
dependencies = [
    "mnemostack>=2.2",
]

[project.optional-dependencies]
# The provider still requires Hermes's MemoryProvider ABC at runtime.
# Managed Hermes supplies the host; a transitive PyPI dependency on it is
# shadowed by the workspace root and prevents uv from resolving the plugin.
# Standalone pip installs can request the host explicitly instead.
hermes = ["hermes-agent>=0.19"]
dev = [
    "pytest>=7.4",
    # A hung test must fail in seconds, not burn a CI job to its six-hour
    # limit — which is what a Windows-only `tempfile` retry loop did here.
    "pytest-timeout>=2.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
hermes-mnemostack = "hermes_mnemostack.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
mnemostack = "hermes_mnemostack.provider:MnemostackProvider"

[project.urls]
Homepage = "https://github.com/udjin-labs/hermes-mnemostack"
Repository = "https://github.com/udjin-labs/hermes-mnemostack"
Issues = "https://github.com/udjin-labs/hermes-mnemostack/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The 0.19 directory shim ships INSIDE the package so `hermes-mnemostack
# install` has something to copy; plugin.yaml and its README are data files
# and would otherwise be left out of the wheel.
[tool.setuptools.package-data]
hermes_mnemostack = ["plugin/plugin.yaml", "plugin/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Per test, generous next to the slowest real one (a prefetch join waits
# 2s) and small enough that a deadlock is a red build within a minute.
# Chosen after a Windows-only retry loop ran one job for 5:58:20.
timeout = 60
